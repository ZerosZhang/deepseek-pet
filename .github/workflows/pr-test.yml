name: PR Test Gate

# 本仓库是上游 MerZlin/dsh-pet-indesktop 的 Windows 精简版：
# 只保留 Windows runner 的测试 + ruff 门禁；macOS / Linux 的构建与测试随
# 平台相关代码一起删除，别再往 matrix 里加回来。
#
# 与 build-windows.yml 的分工：本条给每次 push / PR 提供红绿判定；那条只在
# tag 或手动触发时打包发布。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    # 编码隔离（issue #26）：强制 UTF-8，避免中文源码/资源被 legacy 编码二次解码
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: offscreen
      # keyring 在无桌面环境的 runner 上可能弹后端探测；测试不需要真实钥匙串
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record resolved source SHA
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          {
            echo "### 解析到的源码版本"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| event | ${{ github.event_name }} |"
            echo "| workflow ref | ${{ github.ref }} |"
            echo "| github.sha（PR = 合并提交） | ${{ github.sha }} |"
            echo "| checkout HEAD | $HEAD_SHA |"
            echo "| checkout HEAD 摘要 | $(git log -1 --format=%s) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 「这一轮到底装了什么」必须留痕：requirements.txt 全是 `>=` 无上限、无 lock，
      # imageio-ffmpeg 每平台是不同的 ffmpeg 构建，是 webm 族时序 flake 的差异源。
      - name: Record toolchain versions
        shell: bash
        run: |
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"
          {
            echo "### 工具链"
            echo ""
            echo "- python: $(python --version 2>&1)"
            echo ""
            echo "<details><summary>pip freeze</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/pip-freeze.txt"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ruff
        run: ruff check pet/ tests/

      # 主套件走分片（scripts/ci_shards.py：收集序四等分、四个独立进程）。
      # 2026-10-13 起 hosted runner 单进程整跑会在 ~2/3 处偶发 access violation
      # （崩点漂移的堆腐蚀签名，本机 6.11.2 不复现）；分片让每个进程的堆状态从头
      # 开始，腐蚀没有积累窗口，且崩溃归因更准。不掩盖失败：任一分片红 = 本步红。
      - name: Pytest (main suite, sharded)
        run: python scripts/ci_shards.py

      # webm 生命周期族（reader/ffmpeg 进程 teardown 竞态）偶发段错误，会杀掉整个
      # pytest 进程、拖垮主套件报告，因此拆成独立步骤：崩溃只隔离这一步。
      - name: Pytest (webm lifecycle family, isolated)
        run: python -m pytest -q tests/test_webm_reader_lifecycle.py tests/test_webm_clip_lifecycle.py tests/test_webm_first_frame_lock.py

      # 低优预热让路族依赖真实线程编舞，CI 满载 runner 上批次起步会超时。
      # 隔离 + 允许一次重跑：重跑仍红才算真失败。
      - name: Pytest (low-priority warm family, isolated + one retry)
        run: python -m pytest -q tests/test_low_priority_warm_interaction_yield.py || python -m pytest -q tests/test_low_priority_warm_interaction_yield.py

      # frameseq 族独立重跑位：崩溃杀进程时主套件报告不受影响，照跑照判红。
      - name: Pytest (frameseq isolates, isolated + one retry)
        run: python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py || python -m pytest -q tests/test_frameseq_prefetch_watchdog.py tests/test_frameseq_clip.py

      # 放在所有 pytest 步骤之后：主套件或隔离族失败均可回读最后运行的面包屑。
      - name: Pytest crash diagnostics
        if: failure()
        shell: bash
        run: |
          DIR="${RUNNER_TEMP:-$TMPDIR}/dspet-pytest-diag"
          if [ -f "$DIR/pytest-breadcrumb.txt" ]; then
            echo "::group::$DIR/pytest-breadcrumb.txt (tail -30)"
            tail -n 30 "$DIR/pytest-breadcrumb.txt"
            echo "::endgroup::"
          fi
